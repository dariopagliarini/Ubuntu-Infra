# Tappo ai processi di Apache di WordPress.
#
# La VPS ha 1,8 GB di RAM. L'immagine wordpress:php8.3-apache usa mpm_prefork
# con MaxRequestWorkers 150: poche visite contemporanee bastano a esaurire la
# memoria, e il kernel uccide un container a sua scelta.
#
# Misurato il 19/09/2026: ogni processo costa 25-48 MB di memoria reale (PSS).
# RSS ne diceva 130-155, ma conta piu' volte la memoria condivisa.
#
# Questo file va copiato sull'host in /opt/paglias-site/apache-mpm.conf: e' da
# li' che il compose lo monta.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          5
    MaxRequestWorkers        8
    MaxConnectionsPerChild   500
</IfModule>
