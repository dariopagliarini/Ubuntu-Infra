version: "3.9"

services:
  wordpress:
    image: wordpress:php8.3-apache
    container_name: paglias_wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"

      # HTTP (serve per Let's Encrypt + redirect)
      - "traefik.http.routers.paglias.rule=Host(`paglias-test.xubi.org`)"
      - "traefik.http.routers.paglias.entrypoints=web"
      - "traefik.http.routers.paglias.middlewares=paglias-redirect"

      # HTTPS
      - "traefik.http.routers.paglias-secure.rule=Host(`paglias-test.xubi.org`)"
      - "traefik.http.routers.paglias-secure.entrypoints=websecure"
      - "traefik.http.routers.paglias-secure.tls.certresolver=le"

      # backend
      - "traefik.http.services.paglias.loadbalancer.server.port=80"

      # Redirect HTTP → HTTPS
      - "traefik.http.middlewares.paglias-redirect.redirectscheme.scheme=https"

  db:
    image: mariadb:11
    container_name: paglias_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

networks:
  proxy:
    external: true
  internal:

volumes:
  wp_data:
  db_data:
  