version: "3.9"

services:
  wordpress:
    image: wordpress:php8.3-apache
    container_name: paglias_wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - /opt/paglias-site/wordpress:/var/www/html
      # Tappo ai processi di Apache: 1,8 GB di RAM e MaxRequestWorkers 150
      # di serie non stanno insieme (docs/decisions.md). Il file e' versionato
      # in paglias-website/apache-mpm.conf e va copiato a mano sull'host.
      - /opt/paglias-site/apache-mpm.conf:/etc/apache2/conf-enabled/zzz-mpm.conf:ro
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # HTTP (serve per Let's Encrypt + redirect)
      - "traefik.http.routers.paglias.rule=Host(`paglias.org`)"
      - "traefik.http.routers.paglias.entrypoints=web"
      - "traefik.http.routers.paglias.middlewares=paglias-redirect"

      # HTTPS
      - "traefik.http.routers.paglias-secure.rule=Host(`paglias.org`)"
      - "traefik.http.routers.paglias-secure.entrypoints=websecure"
      - "traefik.http.routers.paglias-secure.tls.certresolver=le"

      - "traefik.http.routers.paglias-www.rule=Host(`www.paglias.org`)"
      - "traefik.http.routers.paglias-www.entrypoints=websecure"
      - "traefik.http.routers.paglias-www.tls.certresolver=le"
      - "traefik.http.routers.paglias-www.middlewares=www-to-apex"
      - "traefik.http.middlewares.www-to-apex.redirectregex.regex=^https://www\\.paglias\\.org/(.*)"
      - "traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://paglias.org/$${1}"

      # backend
      - "traefik.http.services.paglias.loadbalancer.server.port=80"

      # Redirect HTTP → HTTPS
      - "traefik.http.middlewares.paglias-redirect.redirectscheme.scheme=https"

  db:
    image: mariadb:11
    container_name: paglias_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

networks:
  proxy:
    external: true
  internal:

volumes:
  db_data:
  